apiVersion: v1
kind: Pod
metadata:
  name: ml-inference-lab
  labels:
    app: ml-inference
spec:
  nodeSelector:
    accelerator: gpu
  tolerations:
    - key: "workload"
      operator: "Equal"
      value: "ai"
      effect: "NoSchedule"
  containers:
    - name: inference
      image: python:3.12-alpine
      command:
        - sh
        - -c
        - |
          echo "Loading model..."
          echo "Inference service started"
          sleep 3600
